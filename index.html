<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand Hyatt Resort Experience Map</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071b1d;color:#fff;font-family:Arial,sans-serif}
header{padding:14px 18px;background:#0b292b;display:flex;justify-content:space-between;gap:10px;align-items:center}
h1{margin:0;font-size:20px}.sub{font-size:12px;color:#abc1c2;margin-top:3px}.demo{background:#f2c85b;color:#242018;padding:7px 10px;border-radius:99px;font:bold 11px Arial}
.filters{padding:10px 12px;background:#0d3638;display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid #ffffff26;background:#0a2527;color:#fff;border-radius:99px;padding:8px 12px;cursor:pointer}
.filters button.on{background:#fff;color:#0a2527}
.stage{overflow:auto;background:#0b575a;min-height:calc(100vh - 112px)}
.map{position:relative;width:min(1200px,100%);min-width:850px;aspect-ratio:1487/1058;margin:auto;background:#164e50}
.map img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#d3e6e6;font-weight:700}
.pin{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;cursor:pointer;z-index:2;box-shadow:0 4px 12px #0008}
.live{background:#ff7146;animation:p 1.7s infinite}.chill{background:#4fcd98}.soon{background:#f2c85b;color:#222}.closed{background:#8fa3b5}.activity{background:#51457c;border-radius:12px;width:43px}
@keyframes p{70%{box-shadow:0 0 0 13px #ff714600,0 4px 12px #0008}}
.panel{position:fixed;right:15px;bottom:15px;width:min(370px,calc(100vw - 30px));background:#061d1fee;border:1px solid #ffffff24;border-radius:18px;padding:16px;z-index:5;display:none}.panel.open{display:block}
.close{float:right;border:0;background:none;color:white;font-size:23px}.panel h2{margin:8px 0}.panel p{color:#bad0d1;font-size:13px;line-height:1.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:#ffffff10;border-radius:12px;padding:10px}.card small{display:block;color:#93abad}
@media(max-width:700px){h1{font-size:16px}.map{min-width:900px}}
</style></head>
<body>
<header><div><h1>Grand Hyatt Resort Experience Map</h1><div class="sub">Interactive guest-experience concept • walking routes will be added after path approval</div></div><div class="demo">DEMO DATA</div></header>
<div class="filters"><button class="on" data-f="all">All</button><button data-f="live">🔥 Live now</button><button data-f="restaurant">Dining</button><button data-f="family">Family</button><button data-f="water">Water</button></div>
<main class="stage"><div class="map" id="map"><img id="mapimg" alt="Resort map" src="resort-map.webp"></div></main>
<aside class="panel" id="panel"><button class="close" id="x">×</button><div id="state"></div><h2 id="ttl"></h2><p id="desc">Concept information only. Real venue names, opening hours and activity schedules will be added next.</p><div class="grid"><div class="card"><small>Today</small><b id="hrs">Demo hours</b></div><div class="card"><small>Activity</small><b id="act"></b></div><div class="card"><small>Best for</small><b id="best"></b></div><div class="card"><small>Walking</small><b>Route coming later</b></div></div></aside>
<script>
const P=[
['1','Restaurant 1','restaurant',58.8,70.6,'chill','Relaxed dining','Dinner'],
['2','Restaurant 2','restaurant',61,66.3,'live','Live now','Music & dinner'],
['3','Restaurant 3','restaurant',58.9,62.5,'soon','Starting soon','Evening'],
['4','Restaurant 4','restaurant',51.2,73.9,'live','Live experience','Dinner'],
['5','Restaurant 5','restaurant',78.2,51.6,'closed','Closed','Lunch'],
['6','Restaurant 6','restaurant',31.9,87.5,'chill','Chill','Sunset'],
['7','Restaurant 7','restaurant',23.3,92.3,'live','Live now','Families'],
['8','Restaurant 8','restaurant',21.7,77.7,'chill','Chill','Families'],
['9','Restaurant 9','restaurant',26.6,81.9,'soon','Starting soon','Families'],
['🧒','Camp Hyatt','family',20.8,81,'live','Kids activities','Ages 4–12'],
['🎧','Hideaway','family',24.4,84,'chill','Teen activities','Ages 12–17'],
['🏊','Family Pool','family',22.1,85.6,'chill','Open swim','Families'],
['💦','Kids Pool & Splash','family',27.3,86,'live','Splash activity','Children'],
['🛶','Wama Water Activities','water',19,73.7,'soon','Kayaking / water activities','Adventure']
];
const m=document.getElementById('map'),pan=document.getElementById('panel');
P.forEach((p,i)=>{let b=document.createElement('button');b.className='pin '+p[5]+(p[2]=='restaurant'?'':' activity');b.dataset.t=p[2];b.dataset.s=p[5];b.style.left=p[3]+'%';b.style.top=p[4]+'%';b.textContent=p[0];b.onclick=()=>{ttl.textContent=p[1];act.textContent=p[6];best.textContent=p[7];state.textContent=p[5]=='live'?'🔥 Live now':p[5]=='soon'?'◐ Starting soon':p[5]=='chill'?'● Chill / available':'○ Closed';pan.classList.add('open')};m.appendChild(b)});
x.onclick=()=>pan.classList.remove('open');
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(q=>q.classList.remove('on'));b.classList.add('on');let f=b.dataset.f;document.querySelectorAll('.pin').forEach(q=>q.style.display=f=='all'||(f=='live'&&q.dataset.s=='live')||q.dataset.t==f?'grid':'none')});
mapimg.onerror=()=>{const d=document.createElement('div');d.className='loading';d.textContent='Map failed to load. Please refresh.';m.prepend(d)};
</script></body></html>
